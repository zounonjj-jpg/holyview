</g>
<path d="M157 455Q280 480 403 455" fill="none" stroke="#efce83" stroke-width="2" stroke-opacity=".55"/>
<style>
.aura{transform-box:fill-box;transform-origin:center;animation:auraPulse 7s ease-in-out infinite}
.rays{transform-box:fill-box;transform-origin:center;animation:raysTurn 72s linear infinite}
.halo{transform-box:fill-box;transform-origin:center;animation:haloPulse 6s ease-in-out infinite}
.halo-inner{animation-delay:.7s}
.figure{transform-box:fill-box;transform-origin:center;animation:figureFloat 6.5s ease-in-out infinite}
.diamonds{transform-box:fill-box;transform-origin:center;animation:diamondDrift 7s ease-in-out infinite}
.crystal-frame{animation:crystalShine 5s ease-in-out infinite}
@keyframes auraPulse{0%,100%{opacity:.65;transform:scale(.95)}50%{opacity:1;transform:scale(1.05)}}
@keyframes raysTurn{to{transform:rotate(360deg)}}
@keyframes haloPulse{0%,100%{opacity:.55;transform:scale(.97)}50%{opacity:1;transform:scale(1.04)}}
@keyframes figureFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes diamondDrift{0%,100%{opacity:.62;transform:translateY(0) scale(.97)}50%{opacity:1;transform:translateY(-7px) scale(1.03)}}
@keyframes crystalShine{0%,100%{opacity:.7}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</svg>