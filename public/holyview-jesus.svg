 <path d="M249 164Q247 134 272 127Q299 119 313 145L309 162L300 145L282 139L265 145Z" fill="url(#hair)"/>
 <path d="M250 159Q245 192 263 210L252 216Q234 194 239 160Z" fill="url(#hair)"/>
 <path d="M310 159Q315 192 297 210L308 216Q326 194 321 160Z" fill="url(#hair)"/>
 <path d="M266 171Q270 169 274 171M286 171Q290 169 294 171" fill="none" stroke="#56392a" stroke-width="2" stroke-linecap="round"/>
 <path d="M278 175L275 186L281 188M270 196Q280 201 290 196" fill="none" stroke="#8c5c45" stroke-width="1.8" stroke-linecap="round"/>
 <path d="M264 202Q280 211 296 202" fill="none" stroke="#8d634b" stroke-width="4" stroke-linecap="round" opacity=".8"/>
</g>
<g class="diamonds" fill="#fff2bf" filter="url(#crisp-glow)">
 <path d="M157 127L163 140L176 146L163 152L157 165L151 152L138 146L151 140Z"/>
 <path d="M405 100L410 111L421 116L410 121L405 132L400 121L389 116L400 111Z"/>
 <path d="M432 320L437 331L448 336L437 341L432 352L427 341L416 336L427 331Z"/>
